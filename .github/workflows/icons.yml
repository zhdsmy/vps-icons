name: Check icons
on: [push, pull_request]
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm run check
      - name: Verify generated files are committed
        run: test -z "$(git status --porcelain --untracked-files=all)"
