name: Check icons
on: [push, pull_request]
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm run check
      - name: Verify generated files are in sync
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            git diff --stat
            echo "Generated files are out of sync. Run 'npm run build' and commit the results."
            exit 1
          fi
