<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vps-icons · 云厂商图标预览 / Icon catalog preview</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #edeee8; color: #15251e; font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif }
main { max-width: 1540px; margin: auto; padding: clamp(16px, 3vw, 44px) }
header { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 24px }
h1, h2, p { margin: 0 }
h1 { font-size: clamp(28px, 3.6vw, 46px); line-height: 1.08; letter-spacing: -.045em }
header p { margin-top: 8px; color: #46584e; max-width: 78ch }
header p.sub { margin-top: 4px; font-size: 13px; color: #5b6d63 }
nav { display: flex; border: 1px solid #abb4a9; border-radius: 6px; padding: 3px; gap: 3px }
nav a { color: inherit; padding: 6px 12px; text-decoration: none; border-radius: 3px; font-size: 14px }
body:not(:has(.view:target)) [href="#both"], body:has(#both:target) [href="#both"],
body:has(#light:target) [href="#light"], body:has(#dark:target) [href="#dark"] { background: #244c3d; color: white }
.panels { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px }
.panel { min-width: 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink) }
.light { --bg: #fff; --ink: #14251d; --muted: #526258; --line: #e0e5df }
.dark { --bg: #111827; --ink: #f1f5f9; --muted: #94a3b8; --line: #273449 }
h2 { font-size: 20px; letter-spacing: -.03em; padding: 16px 18px 6px }
table { border-collapse: collapse; width: 100%; min-width: 435px }
th, td { border-bottom: 1px solid var(--line); padding: 8px 5px }
thead th { color: var(--muted); font-size: 12px; font-weight: 500 }
th:first-child { padding-left: 18px; text-align: left }
tbody th { font-weight: 600; font-size: 14px; line-height: 1.25 }
tbody th a { color: inherit; text-decoration: none }
a:hover { text-decoration: underline }
code { display: block; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-top: 3px }
.pair { display: flex; align-items: center; justify-content: center; gap: 6px }
#light:target ~ main .dark, #dark:target ~ main .light { display: none }
body:has(#dark:target) { background: #0b1120; color: #f1f5f9 }
body:has(#dark:target) header p { color: #cbd5e1 }
body:has(#dark:target) header p.sub { color: #94a3b8 }
body:has(#light:target, #dark:target) .panels { grid-template-columns: minmax(0, 1fr) }
body:has(#light:target, #dark:target) main { max-width: 960px }
@media(max-width: 1050px) { .panels { grid-template-columns: minmax(0, 1fr) } }
</style>
<span id="light" class="view"></span><span id="dark" class="view"></span><span id="both" class="view"></span>
<main>
<header>
  <div>
    <h1>vps-icons</h1>
    <!-- summary -->
  </div>
  <nav aria-label="Background"><a href="#both">双背景 / Both</a><a href="#light">浅色 / Light</a><a href="#dark">深色 / Dark</a></nav>
</header>
<div class="panels"><!-- panels --></div>
</main>
</html>
